name: Validate bundles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_bundles.py
      - name: Build release archives
        shell: pwsh
        run: ./scripts/build_release.ps1
      - run: python scripts/validate_release.py
      - name: Smoke-test one-folder installation
        shell: pwsh
        run: ./scripts/smoke_one_folder.ps1
